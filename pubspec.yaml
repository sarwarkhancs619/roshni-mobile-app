name: roshni_rams
description: Roshni Association Management System (RAMS) - Enterprise Rehabilitation Management System.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^14.2.0

  # Local Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI and Typography
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2

  # Reporting, Analytics & Helpers
  pdf: ^3.10.8
  fl_chart: ^0.68.0
  csv: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3

  # Supabase Integration
  supabase_flutter: ^2.5.5
  flutter_dotenv: ^5.1.0
  file_picker: ^11.0.2
  speech_to_text: ^7.4.0
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - .env

